<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BPC Notebook</title>
    <style>html, body, #content { height: 100%; margin: 0; }</style>
    <link rel="stylesheet" href="css/style.css" />
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.120.41/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon_dark"
      data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.codeeditor"
      data-sap-ui-resourceroots='{"bpc.notebook":"./"}'
      data-sap-ui-compatVersion="edge"
    ></script>
    <script>
      sap.ui.getCore().attachInit(function () {
        new sap.ui.core.ComponentContainer({ name: "bpc.notebook", height: "100%" }).placeAt("content");
      });
    </script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
